ptions": ["pelos órgãos controladores do mercado.", "por compradores e vendedores.", "somente por compradores.", "somente dos vendedores."], "correct": 1, "id": 42, "justificationText": "A função da central de liquidação e compensação (Clearing House) é garantir o cumprimento e a integridade de todos os contratos assumidos por compradores e vendedores. Isso implica que a clearing house atua como intermediária, assegurando que ambas as partes cumpram suas obrigações contratuais, o que justifica a escolha da alternativa B como correta."}, {"ref": "8032", "section": "7.5", "q": "Considerando o value at risk (VAR), assinale a alternativa correta. Investimentos tem como consequência direta:", "options": ["significaoquantouminvestidorteráderetornoapartirdeumdeterminado valor investido.", "significa o retorno máximo que um investidor pode ter.", "significa a média histórica de oscilação de um ativo.", "significaaperdamáximaqueuminvestidorpodeter,comumdeterminado nível de confiança."], "correct": 3, "id": 43, "justificationText": "A alternativa D está correta porque o Value at Risk (VaR) é uma medida que quantifica a perda máxima que um investidor pode enfrentar em um determinado período, dado um nível de confiança específico. Essa definição está alinhada com o conceito de VaR, que busca estimar o risco de perda em uma carteira de investimentos."}, {"ref": "4584", "section": "7.5", "q": "Seu cliente tem um imóvel cujo valor de mercado é 50 mil reais. Ele decidiu vendê-lo para solucionar problemas financeiros. A única pro- posta de compra que recebeu foi de R$ 30 mil. O risco determinante deste investimento foi de:", "options": ["inflação.", "liquidez.", "crédito.", "câmbio."], "correct": 1, "id": 44, "justificationText": "A alternativa B) liquidez está correta porque a situação apresentada envolve a venda de um imóvel, cujo valor de mercado é significativamente maior do que a proposta recebida. Isso indica um problema de liquidez, já que o cliente não consegue vender o ativo pelo seu valor justo e enfrenta dificuldades financeiras."}, {"ref": "3611", "section": "7.5", "q": "Um fundo de investimento em ações, amplamente diversificado, poderá eliminar o risco:", "options": ["relativo.", "sistemático.", "de crédito.", "não sistemático."], "correct": 3, "id": 45, "justificationText": "Um fundo de investimento em ações, ao ser amplamente diversificado, é capaz de eliminar o risco não sistemático, que é o risco específico de uma empresa ou setor. A diversificação permite que os efeitos negativos de perdas em alguns ativos sejam compensados por ganhos em outros, reduzindo assim a exposição a riscos que não afetam o mercado como um todo. Portanto, a alternativa D está correta."}, {"ref": "3727", "section": "8.23", "q": "O IGC (Índice de Governança Corporativa) é composto por ações listadas na bolsa de valores nos segmentos:", "options": ["apenas nível 1.", "somente nível 1 e nível 2.", "nível 1, nível 2 e novo mercado.", "novo mercado e nível 2, apenas."], "correct": 2, "id": 46, "justificationText": "INSUFICIENTE: O contexto não fornece informações sobre a composição do IGC."}, {"ref": "9854", "section": "8.23", "q": "A NTN-B está atrelada à variação do(a):", "options": ["IGP-M.", "IPCA.", "Taxa Selic.", "dólar."], "correct": 1, "id": 47, "justificationText": "INSUFICIENTE: Não há informação no contexto sobre a NTN-B e sua relação com o IPCA."}, {"ref": "3860", "section": "8.23", "q": "Os underwriters em geral são:", "options": ["bancos comerciais, sociedades corretoras e sociedades distribuidoras.", "bancos de investimento, sociedades corretoras, sociedades distribuidoras.", "financeiras, sociedades corretoras e sociedades distribuidoras.", "agenteautônomos,bancosdeinvestimento,sociedadescorretoras,sociedades distribuidoras."], "correct": 1, "id": 48, "justificationText": "Os agentes underwriters são definidos como instituições financeiras ou não financeiras especializadas em coordenar processos de emissões de valores mobiliários. A alternativa B é correta, pois menciona bancos de investimento, sociedades corretoras e sociedades distribuidoras, que são as entidades que atuam nesse papel no mercado financeiro."}, {"ref": "3990", "section": "8.23", "q": "A TopInvest tem 1.000 ações a R$ 4 cada. A empresa decidiu realizar uma bonificação em ações, que representavam R$ 2.000,00. Um acionistapossui40%docapitalsocietário. Depoisdesteaumento,esteacionista terá:", "options": ["200 ações.", "400 ações.", "600 ações.", "800 ações."], "correct": 2, "id": 49, "justificationText": "INSUFICIENTE: O contexto não fornece informações específicas sobre o cálculo da bonificação em ações e a quantidade de ações que o acionista terá após o aumento de capital."}, {"ref": "4630", "section": "8.23", "q": "Sobre os CDBs podemos afirmar:", "options": ["podem ser emitidos por prazos muito curtos, inclusive por um dia.", "o cliente corre o risco de crédito da instituição (acima de R$ 250.000,00).", "todas as alternativas estão corretas", "podem ser pactuados com taxas de juros fixas ou flutuantes (pós-fixada). ."], "correct": 2, "id": 50, "justificationText": "INSUFICIENTE: O contexto não fornece informações específicas sobre os CDBs."}, {"ref": "9902", "section": "8.23", "q": "É possível compensar ganhos auferidos em operações realizadas no mercado futuro na B3 com perdas incorridas em:", "options": ["planos de previdência privada.", "fundos de investimento em renda variável.", "fundos de investimento em renda fixa.", "operações da B3 de mesma espécie."], "correct": 3, "id": 51, "justificationText": "A alternativa D está correta porque as regras de compensação de ganhos e perdas em operações na B3 permitem que perdas incorridas em uma operação sejam compensadas com ganhos de operações da mesma espécie, como as realizadas no mercado futuro. Isso garante que o investidor possa equilibrar sua situação fiscal em relação a operações semelhantes."}, {"ref": "3597", "section": "8.23", "q": "Em uma operação de underwriting de melhor esforço:", "options": ["asinstituiçõesfinanceirasassumemapenasocompromissodecolocaromáx- imo de uma emissão nas melhores condições possíveis e em um determi- nado período.", "as instituições financeiras estabelecem como meta um determinado per- centualdostítulosaseremoferecidosaopúblicoeassumemocompromisso de subscrever o restante.", "asinstituiçõesfinanceirassecomprometemasubscreverelasprópriasqual- quer quantidade de ativos que não tenham sido vendidos ao público.", "as dificuldades de colocação dos ativos não se refletem diretamente na em- presa emissora."], "correct": 0, "id": 52, "justificationText": "A alternativa A está correta porque define que, em uma operação de underwriting de melhor esforço, as instituições financeiras se comprometem apenas a colocar o máximo de uma emissão nas melhores condições possíveis dentro de um determinado período. Isso reflete a natureza desse tipo de underwriting, onde não há garantia de que todos os títulos serão vendidos."}, {"ref": "3907", "section": "8.23", "q": "A importância do mercado secundário:", "options": ["é aumentar ou diminuir recursos para financiar novos empreendimentos.", "dar rapidez aos ativos financeiros, negociados no mercado primário e inter- bancário.", "é dar liquidez aos ativos financeiros, negociados no mercado primário.", "éigualadoprimário,umavezquesuaexistêncianãoécondiçãoparaofun- cionamento do outro."], "correct": 2, "id": 53, "justificationText": "A alternativa C está correta porque o mercado secundário tem como função principal proporcionar liquidez aos ativos financeiros que foram negociados no mercado primário. Isso permite que os investidores possam comprar e vender esses ativos com maior facilidade, aumentando a eficiência do mercado."}, {"ref": "9853", "section": "8.23", "q": "É igual a do primário, uma vez que sua existência não é condição para o funcionamento do outro:", "options": ["Válida até…", "Válida até cancelar…", "Executa ou cancela…", "Cancelar se.."], "correct": 3, "id": 54, "justificationText": "INSUFICIENTE: Não há informações suficientes no contexto para justificar a alternativa correta."}, {"ref": "9847", "section": "9.14", "q": "Em alguns casos, uma ou mais taxas de remuneração de fun- dos são devolvidas ao investidor se houver obediência às regras específicas, por exemplo, tempo de permanência no fundo, solicitação de resgate com grande antecedência, etc. Outros exemplos são:", "options": ["de administração.", "de performance.", "de custódia.", "de carregamento."], "correct": 1, "id": 55, "justificationText": "A alternativa B) de performance está correta porque, em alguns casos, as taxas de performance dos fundos podem ser devolvidas ao investidor se forem seguidas regras específicas, como tempo de permanência no fundo e solicitação de resgate com antecedência. Isso demonstra que a taxa de performance está sujeita a condições que podem resultar em devolução ao investidor."}, {"ref": "3143", "section": "9.14", "q": "Os ativos presentes no fundo de investimento são de propriedade:", "options": ["do gestor do fundo.", "do custodiante do fundo.", "dos cotistas do fundo.", "do administrador do fundo."], "correct": 2, "id": 56, "justificationText": "Os ativos presentes no fundo de investimento são de propriedade dos cotistas do fundo, pois a estrutura dos fundos de investimento é projetada para que os investidores (cotistas) detenham os direitos sobre os ativos que compõem a carteira do fundo. Essa característica é fundamental para a operação dos fundos, garantindo que os cotistas participem dos resultados proporcionais aos seus investimentos."}, {"ref": "4712", "section": "9.14", "q": "Nos fundos de investimento, a marcação dos títulos prefixados pela taxa nominal provoca:", "options": ["equidade entre os cotistas, não importando em que momento cada cotista aplicou ou resgatou no fundo.", "aumento de patrimônio líquido, pois os títulos podem ser negociados a val- ores de mercado e gerar lucros para o fundo.", "distorção na rentabilidade apurada, podendo ocorrer distribuição de renda entre os cotistas.", "diferença contábil diária no patrimônio líquido, ajustada mensalmente no balanço."], "correct": 2, "id": 57, "justificationText": "A alternativa C está correta porque a marcação a mercado pode levar a uma distorção na rentabilidade apurada dos fundos de investimento. Isso ocorre devido à variação dos preços dos títulos prefixados, que podem resultar em diferentes rentabilidades para cotistas que aplicaram ou resgataram em momentos distintos, possibilitando assim a distribuição de renda entre eles."}, {"ref": "3880", "section": "9.14", "q": "Um cliente investiu 10 mil reais em um fundo de investimento de curto prazo para fins tributários há mais de dois anos. No próximo dia 31 de maio, esse investidor será tributado pelo come-cotas à alíquota de:", "options": ["20%.", "15%.", "17,5%.", "22,5%."], "correct": 0, "id": 58, "justificationText": "INSUFICIENTE: O contexto não fornece informações sobre a tributação do come-cotas para fundos de investimento de curto prazo."}, {"ref": "4343", "section": "9.14", "q": "Um fundo de investimento poderá cobrar a taxa de performance, prevista em regulamento:", "options": ["após a cobrança da taxa de administração e de outras despesas.", "desde que o ciclo mínimo de cobrança seja de 12 meses.", "desde que o percentual de benchmark seja inferior a 100% de sua variação.", "após a cobrança do IR."], "correct": 0, "id": 59, "justificationText": "A alternativa A está correta porque a cobrança da taxa de performance em fundos de investimento deve ocorrer após a dedução da taxa de administração e de outras despesas, conforme as regras gerais de funcionamento desses fundos. Essa prática assegura que a taxa de performance seja calculada sobre o rendimento líquido, refletindo a verdadeira performance do fundo após custos."}, {"ref": "3680", "section": "9.14", "q": "Em relação ao seu benchmark, é característica de um fundo ativo e passivo, respectivamente:", "options": ["acompanhar e acompanhar o benchmark.", "superar e superar o benchmark.", "superar e superar o benchmark.", "superar e acompanhar o benchmark."], "correct": 3, "id": 60, "justificationText": "A alternativa D é correta porque um fundo ativo tem como objetivo superar o benchmark, buscando um desempenho melhor do que o índice de referência, enquanto um fundo passivo tem a característica de acompanhar o benchmark, replicando sua performance. Essa distinção é fundamental na gestão de fundos de investimento."}, {"ref": "3214", "section": "9.14", "q": "A alíquota de IOF para aplicações em fundos de investimento será igual a zero quando o prazo de aplicação for superior a:", "options": ["29 dias.", "20 dias.", "180 dias.", "360 dias."], "correct": 0, "id": 61, "justificationText": "INSUFICIENTE: Não há informações no contexto sobre a alíquota de IOF para aplicações em fundos de investimento."}, {"ref": "3315", "section": "9.14", "q": "Um fundo multimercado é aquele que:", "options": ["investe em vários fatores de risco sem particularidade na concentração.", "investe (obrigatoriamente) em ações, para uma parcela dos recursos.", "investe 25% do seu patrimônio líquido no mercado internacional.", "investeemváriosfatoresderiscocomconcentraçãodasalocaçõesnosmer- cados mais arriscados."], "correct": 0, "id": 62, "justificationText": "A alternativa A está correta porque define um fundo multimercado como aquele que investe em diversos fatores de risco sem uma concentração específica, permitindo uma maior diversificação nas alocações. Essa característica é essencial para a flexibilidade e a estratégia de investimento desse tipo de fundo."}, {"ref": "3462", "section": "9.14", "q": "A remuneração do administrador de um fundo pode ser feita pela cobrança da taxa de administração fixa e:", "options": ["de performance e retorno.", "de entrada e/ou saída e/ou retorno.", "de entrada e retorno.", "de performance, de ingresso e saída."], "correct": 3, "id": 63, "justificationText": "INSUFICIENTE: O contexto não fornece informações específicas sobre a remuneração do administrador de um fundo e suas taxas."}, {"ref": "4146", "section": "10.6", "q": "Assinale a alternativa errada a respeito do fundo de investimento imobiliário (FII):", "options": ["o rendimento obtido pelo investidor na venda de cotas do FII é tributado à alíquota de 20%.", "o FII, como todo fundo de investimento, não é tributado.", "em um FII, o cotista pessoa física não será tributado sobre os rendimentos distribuídos, desde que tenha menos que 10% do total de cotas e tenha di- reito a menos que 10% dos rendimentos distribuídos. É necessário também quetenhasuascotasadmitidasànegociaçãoembolsaoubalcãoorganizado e a quantidade de cotistas seja igual ou superior a 50.", "novencimentodofundo,oganhoobtidopelocotistaserátributadonafonte."], "correct": 1, "id": 64, "justificationText": "INSUFICIENTE: O contexto não fornece informações sobre a tributação específica de fundos de investimento imobiliário (FII)."}, {"ref": "4621", "section": "10.6", "q": "O Imposto de Renda cobrado em aplicações realizadas por pessoa jurídica em fundo de investimento imobiliário deve:", "options": ["incidirsobreosganhosdecapitalesobreosrendimentosaumaalíquotade 15%.", "incidir somente sobre os rendimentos a uma alíquota de 15%.", "incidir somente sobre os ganhos de capital a uma alíquota de 20%.", "incidirsobreosganhosdecapitalesobreosrendimentosaumaalíquotade 20%."], "correct": 3, "id": 65, "justificationText": "INSUFICIENTE: Não há informações no contexto que fundamentem a justificativa para a alternativa correta."}, {"ref": "3263", "section": "10.6", "q": "As características de um FIDC são:", "options": ["aplicação mínima inicial de R$ 50.000,00.", "deve aplicar 80% no mínimo em direitos creditórios.", "316", "deve ter seus ativos classificador por agência classificadora de risco.", "qualquer investidor pode aplicar nesse tipo de fundo."], "correct": 2, "id": 66, "justificationText": "INSUFICIENTE: O contexto não fornece informações suficientes sobre a alternativa C) 316."}, {"ref": "4087", "section": "10.6", "q": "Em relação aos FIDCS, as cotas:", "options": ["sênior tem preferencia no recebimento.", "subordinadas tem preferência no recebimento.", "sênior contam com a cobertura do FGC, as subordinadas não.", "sênior receberão depois das subordinadas."], "correct": 0, "id": 67, "justificationText": "A alternativa A está correta porque, em relação aos FIDCs, as cotas sênior realmente têm preferência no recebimento em comparação às cotas subordinadas. Essa estrutura de prioridade é uma característica comum em fundos de investimento, onde as cotas sênior são pagas antes das subordinadas em caso de liquidação ou distribuição de recursos."}, {"ref": "4047", "section": "10.6", "q": "Um fundo de investimento cujo objetivo é acompanhar a perfor- mance do Ibovespa:", "options": ["é um fundo de ações indexado.", "é um fundo que tem sua carteira composta por títulos de renda fixa.", "é um título de renda fixa indexado.", "se caracteriza como um fundo com gestão ativa."], "correct": 0, "id": 68, "justificationText": "Um fundo de investimento cujo objetivo é acompanhar a performance do Ibovespa é classificado como um fundo de ações indexado, pois ele replica a variação do índice, conforme mencionado no contexto. Essa característica é essencial para a definição de um fundo que busca seguir o desempenho de um benchmark específico, como o Ibovespa."}, {"ref": "4335", "section": "10.6", "q": "Em relação à tributação dos fundos de investimento imobiliário pelo Imposto de Renda, é correto afirmar que:", "options": ["hádoistiposdefatosgeradores,adistribuiçãodoslucrosauferidospelofundo aoscotistaseaobtençãodeganhodecapitalerendimentosnaalienaçãoou resgates de cotas.", "oimpostoapuradodeveserrecolhidopeloprópriotitulardascotas,em31de junho e 31 de dezembro de cada ano.", "trata-se de uma modalidade de investimento isenta de imposto, para pes- soa jurídica, sobre os ganhos de capital e/ou rendimentos na alienação ou resgates das cotas.", "os lucros auferidos pelos fundos distribuídos aos cotistas devem ser tributa- dos na fonte à alíquota de 15%."], "correct": 0, "id": 69, "justificationText": "A alternativa A está correta porque menciona os dois tipos de fatos geradores na tributação dos fundos de investimento imobiliário: a distribuição dos lucros aos cotistas e a obtenção de ganho de capital na alienação ou resgates de cotas. Essa distinção é fundamental para entender como se dá a tributação nesse tipo de investimento."}, {"ref": "3554", "section": "10.6", "q": "Os retornos oriundos por pessoa física no resgate de cotas de fundos imobiliários, cujas cotas são negociadas em bolsa de valores, terão alíquotas de:", "options": ["22,5%.", "come-cotas.", "20%.", "15%."], "correct": 2, "id": 70, "justificationText": "INSUFICIENTE: Não há informação no contexto que permita fundamentar a resposta sobre as alíquotas de retornos oriundos por pessoa física no resgate de cotas de fundos imobiliários."}, {"ref": "4657", "section": "10.6", "q": "Sobre o fundo de investimento imobiliário (FII): I.éconstituídonaformadecondomíniofechadoepodeterprazodeduração indeterminado; II. pode ser objeto de oferta para investidores de varejo ou qualificados; III.podeadquiriraparticipaçãoemempreendimentosimobiliários, pormeio de letra hipotecária (LH), letra de crédito imobiliário (LCI) e certificados de recebíveis imobiliários (CRI). Está(ão) correta(s):", "options": ["III.", "I, II e III.", "I e II.", "I e II."], "correct": 1, "id": 71, "justificationText": "A alternativa B está correta porque afirma que os fundos de investimento imobiliário (FII) podem ser constituídos na forma de condomínio fechado com prazo de duração indeterminado, podem ser oferecidos a investidores de varejo ou qualificados, e têm a possibilidade de adquirir participação em empreendimentos imobiliários por meio de letras hipotecárias, letras de crédito imobiliário e certificados de recebíveis imobiliários. Essas características são compatíveis com as definições e regulamentações sobre FII."}, {"ref": "4166", "section": "10.6", "q": "Um fundo referenciado que possuir mais de 50% de sua carteira composta por títulos de emissão de pessoas físicas ou jurídicas de direito privado:", "options": ["deve vender tais títulos, pois o limite máximo aceitável de concentração da carteira para esse tipo de risco é de 5%.", "precisa conter, na denominação do fundo, a expressão \"crédito privado\".", "estará de acordo com a legislação vigente.", "terá um retorno provavelmente inferior a um concorrente que possua so- mente títulos públicos em sua composição."], "correct": 1, "id": 72, "justificationText": "A alternativa B está correta porque, de acordo com a regulamentação vigente, um fundo referenciado que possui mais de 50% de sua carteira composta por títulos de emissão de pessoas físicas ou jurídicas de direito privado deve incluir a expressão \"crédito privado\" em sua denominação. Essa exigência visa garantir transparência e clareza sobre a composição do fundo para os investidores."}, {"ref": "4081", "section": "11.3", "q": "Operação em que uma variedade de ativos é \"empacotada\" na forma de títulos para serem comercializados para investidores:", "options": ["mercado futuro.", "SWAP.", "securitização de recebíveis.", "letra de crédito imobiliário."], "correct": 2, "id": 73, "justificationText": "A alternativa C está correta porque a securitização de recebíveis é definida como uma operação em que uma variedade de ativos é empacotada na forma de títulos para serem comercializados para investidores. Essa descrição se alinha diretamente com a definição apresentada no material de estudo."}, {"ref": "4485", "section": "11.3", "q": "Na composição de uma carteira diversificada de renda fixa para um investidor pessoa física, que exige parte do rendimento com isenção de Imposto de Renda retido na fonte, recomenda-se aplicação em:", "options": ["Certificado de Recebíveis Imobiliários.", "letras de câmbio.", "recibo de depósito bancário.", "fundos de investimento curto prazo."], "correct": 0, "id": 74, "justificationText": "A alternativa correta é a letra A, pois os Certificados de Recebíveis Imobiliários (CRIs) são títulos de renda fixa que oferecem isenção de Imposto de Renda para pessoas físicas, tornando-se uma opção atrativa para investidores que buscam rendimento isento. Essa característica é relevante na composição de uma carteira diversificada de renda fixa."}, {"ref": "9798", "section": "11.3", "q": "A expressão \"securitização\" é usada no mercado para designar:", "options": ["o seguro de um ativo.", "uma garantia na operação de recebíveis.", "um ativo transferível.", "um ativo intransferível."], "correct": 1, "id": 75, "justificationText": "INSUFICIENTE: O contexto não fornece informações suficientes para justificar a alternativa correta."}, {"ref": "4105", "section": "11.3", "q": "É correto falar sobre os Certificados de Recebíveis Imobiliários:", "options": ["somente podem ser distribuídos publicamente com prévia autorização da CVM.", "que elas apresentam isenção do Imposto de Renda para qualquer tipo de investidor.", "que elas são somente emitidas por sociedades de crédito, financiamento e investimento.", "queéuminvestimentolastreadoemfinanciamentosfeitosporempresasde capital aberto."], "correct": 0, "id": 76, "justificationText": "INSUFICIENTE: O contexto não fornece informações específicas sobre os Certificados de Recebíveis Imobiliários e suas condições de distribuição."}, {"ref": "4371", "section": "11.3", "q": "Sobre os Certificados de Recebíveis Imobiliários, é correto afirmar que:", "options": ["é necessária autorização da CVM para o seu registro.", "está coberto pelo fundo garantidor de crédito.", "não possuem garantia real.", "pessoa física que investir em CRI devem recolher Imposto de Renda."], "correct": 0, "id": 77, "justificationText": "INSUFICIENTE: O contexto não fornece informações sobre os Certificados de Recebíveis Imobiliários e sua relação com a CVM."}, {"ref": "4495", "section": "11.3", "q": "Os Certificados de Recebíveis Imobiliários:", "options": ["emitido por companhias securitizadoras.", "não possuem garantia real.", "emitido apenas por banco de investimento.", "emitido apenas por empresas."], "correct": 0, "id": 78, "justificationText": "A alternativa A está correta porque os Certificados de Recebíveis Imobiliários são, de fato, emitidos por companhias securitizadoras, conforme a estrutura de securitização de recebíveis. As demais alternativas estão incorretas, pois não refletem a natureza e as características dos Certificados de Recebíveis Imobiliários."}, {"ref": "9797", "section": "11.3", "q": "Em um processo de securitização de recebíveis, esses recebíveis devem estar registrados no balanço do(da):", "options": ["auditor independente.", "empresa que originou os recebíveis.", "agente fiduciário.", "sociedade de propósito específico."], "correct": 0, "id": 79, "justificationText": "INSUFICIENTE: O contexto não fornece informações sobre o registro de recebíveis em um processo de securitização."}, {"ref": "3578", "section": "11.3", "q": "Emumasecuritizaçãoderecebíveis,ofluxofinanceirodosdireitos de crédito é pago para:", "options": ["o investidor.", "a companhia securitizadora.", "o FGC.", "o devedor."], "correct": 1, "id": 80, "justificationText": "INSUFICIENTE: O contexto não fornece informações específicas sobre o fluxo financeiro dos direitos de crédito em uma securitização."}, {"ref": "9845", "section": "11.3", "q": "As sociedades de crédito imobiliário, em suas atividades, podem empregar recursos provenientes de:", "options": ["depósitos à vista", "letras de câmbio.", "letras hipotecárias", "depósitos a prazo, desde que seja inferior a noventa dias"], "correct": 2, "id": 81, "justificationText": "As sociedades de crédito imobiliário podem empregar recursos provenientes de letras hipotecárias, que são títulos lastreados em créditos imobiliários e emitidos por instituições financeiras autorizadas a conceder créditos hipotecários. Essa relação é fundamental para a operação dessas sociedades, pois as letras hipotecárias garantem a captação de recursos para financiar operações imobiliárias."}, {"ref": "4341", "section": "12.2", "q": "As principais vantagens de um clube de investimentos em relação a um fundo de investimentos em ações são: I. maior influência dos membros na gestão da carteira; II.maiorflexibilidadeemajustaracarteiraaoperfildogrupodeinvestidores; III. taxa de administração mais baixa; IV. custos menores.", "options": ["I, II, III e IV.", "II e III.", "I, II e IV.", "III e IV."], "correct": 0, "id": 82, "justificationText": "INSUFICIENTE: O contexto não fornece informações específicas sobre as vantagens de um clube de investimentos em relação a um fundo de investimentos em ações."}, {"ref": "4243", "section": "12.2", "q": "O percentual mínimo de patrimônio líquido que os clubes de in- vestimentos deverão investir em ações; bônus de subscrição; debêntures conversíveis em ações de emissão de companhias abertas; recibos de sub- scrição; cotas de fundos de índices de ações negociados em mercado orga- nizado; e certificados de depósitos de ações é de:", "options": ["0.51%.", "0.8%.", "0.5%.", "0.67%."], "correct": 3, "id": 83, "justificationText": "INSUFICIENTE: O contexto não fornece informações específicas sobre o percentual mínimo de patrimônio líquido que os clubes de investimentos devem investir nos ativos mencionados."}, {"ref": "4581", "section": "12.2", "q": "Qual o percentual mínimo do patrimônio líquido que os clubes de investimentos deverão investir nas [INSERIR] abaixo? 337 i. ações; ii. bônus de subscrição; iii. debêntures conversíveis em ações, de emissão de companhias abertas; iv. recibos de subscrição; v. cotas de fundos de índices de ações negociados em mercado organizado; vi. certificados de depósitos de ações", "options": ["67%.", "100%.", "50%.", "80%."], "correct": 0, "id": 84, "justificationText": "INSUFICIENTE: O contexto não fornece informações específicas sobre o percentual mínimo do patrimônio líquido que os clubes de investimentos devem investir nos itens mencionados."}, {"ref": "4291", "section": "12.2", "q": "Os ganhos de capital auferidos por clubes de investimentos são tributados pelo imposto de renda à alíquota de:", "options": ["15%.", "17,5%.", "22,5%.", "20%."], "correct": 0, "id": 85, "justificationText": "INSUFICIENTE: Não há informação suficiente no contexto para fundamentar a resposta sobre a alíquota do imposto de renda sobre ganhos de capital auferidos por clubes de investimentos."}, {"ref": "3816", "section": "12.2", "q": "Instrumento legal que permite a reunião de um grupo de investi- dores para investimento em ações:", "options": ["clube de investimento.", "cooperativa de investidores.", "agremiação de investidores.", "assembleia de investidores."], "correct": 0, "id": 86, "justificationText": "A alternativa correta é a letra A, clube de investimento, pois é um instrumento legal que permite a reunião de um grupo de investidores para realizar investimentos em ações, conforme a regulamentação vigente. O clube de investimento possibilita que pequenos investidores tenham acesso a operações mais complexas e sofisticadas do mercado financeiro."}, {"ref": "3357", "section": "12.2", "q": "Podem administrar clubes de investimento:", "options": ["bancodedesenvolvimento,bancodeinvestimento,corretorasedistribuido- ras.", "corretoras, distribuidoras e bancos de investimento.", "banco comercial e corretoras.", "corretoras, distribuidoras e bancos comerciais."], "correct": 1, "id": 87, "justificationText": "A alternativa B está correta porque o contexto menciona que as corretoras, distribuidoras e bancos de investimento são entidades que podem administrar clubes de investimento. Essas instituições têm a capacidade de gerenciar e operar dentro desse tipo de investimento, conforme as regulamentações pertinentes."}, {"ref": "4045", "section": "12.2", "q": "Um clube de investimento:", "options": ["deve ter, no mínimo, três participantes.", "deve ter, no mínimo, dez participantes.", "pode ter um único participante (clube exclusivo).", "deve ter, no mínimo, 150 participantes."], "correct": 0, "id": 88, "justificationText": "A alternativa A está correta porque, segundo o contexto, um clube de investimento deve ter, no mínimo, três participantes. Essa informação é explicitamente mencionada, confirmando a exigência mínima de participantes para a formação de um clube de investimento."}, {"ref": "4353", "section": "12.2", "q": "Em relação aos clubes de investimentos é correto afirmar que:", "options": ["aplica no mínimo 67% de ações.", "nenhum cotista pode deter mais que 51% das cotas do fundo.", "pode ter no máximo 100 cotistas.", "é direcionado às pessoas físicas e jurídicas."], "correct": 0, "id": 89, "justificationText": "INSUFICIENTE: O contexto não fornece informações específicas sobre a porcentagem mínima de ações que um clube de investimentos deve aplicar."}, {"ref": "4277", "section": "12.2", "q": "A carteira de um clube de investimento deve ter:", "options": ["no mínimo 51% em ações.", "no mínimo 67% de ações.", "a quantidade de ações especificada no estatuto.", "100% em ações."], "correct": 1, "id": 90, "justificationText": "INSUFICIENTE: Não há informação suficiente no contexto para justificar a alternativa correta."}, {"ref": "3023", "section": "13.6", "q": "Um cliente possui R$ 5 milhões investidos e necessita de uma renda mensal perpétua de R$ 25.000. O objetivo de rentabilidade mensal desse investidor será aproximadamente de:", "options": ["0,50%.", "0,47%.", "0,61%.", "0,35%."], "correct": 0, "id": 91, "justificationText": "INSUFICIENTE: O contexto não fornece informações suficientes para justificar a alternativa correta."}, {"ref": "3184", "section": "13.6", "q": "Seu cliente consulta o site do Tesouro Nacional e nota que entre os títulos ofertados no dia da consulta, tem os dois títulos abaixo. 1. LTN: 8,86% ao ano. 2. NTN-B principal: 4,03% ao ano. Assumindo que o prazo dos títulos são iguais, seu cliente questiona qual a inflação projetada para o período deste título, você responde que:", "options": ["a taxa de inflação projetada para o período é de 4,83% ao ano.", "a taxa de inflação projetada para o período é de 12,89% ao ano.", "paraconsultaraprojeçãodainflaçãoénecessárioconsultarorelatórioFocus do BC.", "a taxa de inflação projetada para o período é de 4,64% ao ano."], "correct": 3, "id": 92, "justificationText": "INSUFICIENTE: Não há informações suficientes no contexto para justificar a taxa de inflação projetada para o período do título."}, {"ref": "3695", "section": "13.6", "q": "Em um investimento, será maior o valor presente se:", "options": ["o fluxo de pagamento tem de ser arriscado.", "a taxa de desconto for menor.", "o fluxo de pagamento for mais previsível.", "a taxa de desconto for maior."], "correct": 1, "id": 93, "justificationText": "A alternativa B está correta porque, em finanças, o valor presente de um fluxo de caixa é inversamente proporcional à taxa de desconto. Quando a taxa de desconto é menor, o valor presente dos pagamentos futuros aumenta, resultando em um valor presente maior."}, {"ref": "4746", "section": "13.6", "q": "Umapessoapretendeinvestirseusrecursosdeformaagarantiros resgates a seguir para os próximos quatro anos. Qual o valor a ser investido considerando-se uma taxa líquida anual de 6,50% ao ano? 1º ano: R$ 10.000,00. 2º ano: R$ 20.000,00. 3º ano: R$ 35.000,00. 4º ano: R$ 50.000,00.", "options": ["R$ 94.863,73.", "R$ 115.000,00.", "R$ 198.335,24.", "R$ 95.343,22."], "correct": 0, "id": 94, "justificationText": "INSUFICIENTE: Não há informações suficientes no contexto para justificar a alternativa correta."}, {"ref": "3968", "section": "13.6", "q": "Um CDB é negociado a 9% ao ano. Você quer aplicar nesse CDB por seis meses e o gerente informa que a taxa é de 4,5% para esse período. Essas duas taxas são:", "options": ["equivalentes, pois se trata de juros simples.", "equivalentes, pois se trata de juros compostos.", "proporcionais, pois se trata de juros simples.", "proporcionais, pois se trata de juros compostos."], "correct": 2, "id": 95, "justificationText": "INSUFICIENTE: O contexto não fornece informações suficientes sobre a relação entre as taxas de juros do CDB e a aplicação em questão."}, {"ref": "4013", "section": "13.6", "q": "Um investidor efetuou uma aplicação em títulos de renda fixa, que lhe proporcionou um rendimento de 3%. Nesse mesmo período, a taxa de inflação registrou deflação de 2%. A taxa real de juros dessa aplicação foi:", "options": ["superior a nominal.", "negativa.", "igual a nominal.", "inferior a nominal."], "correct": 0, "id": 96, "justificationText": "INSUFICIENTE: O contexto não fornece informações específicas sobre a relação entre a taxa de rendimento e a taxa de inflação para justificar a resposta."}, {"ref": "4773", "section": "13.6", "q": "O valor da taxa equivalente à taxa nominal de 36% ao ano com capitalização mensal é:", "options": ["19,41% ao semestre.", "6,58% ao bimestre.", "3,60% ao mês.", "38,52% ao ano."], "correct": 0, "id": 97, "justificationText": "INSUFICIENTE: Não há informações no contexto que permitam justificar a alternativa correta."}, {"ref": "3596", "section": "13.6", "q": "Um gestor de fundo de ações ativo deseja se proteger do risco sistemático do mercado de ações. Qual operação seria a mais indicada para atingir o seu objetivo?", "options": ["vender contratos futuros de Ibovespa.", "comprar contratos futuros de Ibovespa.", "comprar opções de compra de Ibovespa.", "vender opções de venda de Ibovespa."], "correct": 0, "id": 98, "justificationText": "A alternativa correta é vender contratos futuros de Ibovespa, pois essa operação permite ao gestor de fundo de ações se proteger contra a queda do mercado, mitigando o risco sistemático. Ao vender contratos futuros, o gestor pode compensar perdas na carteira de ações com ganhos nos contratos vendidos, alinhando-se à estratégia de hedge desejada."}, {"ref": "3384", "section": "13.6", "q": "Um fluxo de pagamentos possui três recebimentos para os próx- imos meses (todos no final do mês): R$ 300,00 / R$ 450,00 / R$ 560,00. Utilizando-se uma taxa de desconto de 2% ao mês, qual o VPL desse fluxo?", "options": ["R$ 1.283,80.", "R$ 1.500,00.", "R$ 1.254,34.", "R$ 860,64."], "correct": 2, "id": 99, "justificationText": "INSUFICIENTE: Não há informações suficientes no contexto para calcular o VPL do fluxo de pagamentos mencionado."}, {"ref": "3767", "section": "14.11", "q": "O investidor fez uma aplicação em CDB. Em caso de liquidação extrajudicial do banco:", "options": ["oinvestidorvaireceberovalorinvestidonolimitedeR$250.000doFGC,por CPF/CNPJ.", "cabeaoinvestidorparticipardeassembleiaparatransferirorecursoaplicado em CDB para outro banco.", "oinvestidorvaireceberodinheirodobanco,quegaranteodinheirodocliente mesmo em casos de liquidação extrajudicial.", "o investidor vai receber o dinheiro do BACEN, que garante o dinheiro do cliente mesmo em casos de liquidação extrajudicial."], "correct": 0, "id": 100, "justificationText": "A alternativa A está correta porque o Fundo Garantidor de Créditos (FGC) assegura que os investidores recebam até R$ 250.000,00 por CPF ou CNPJ em caso de liquidação extrajudicial de instituições financeiras. Essa proteção é uma característica fundamental do FGC, que visa proteger os depositantes e investidores em situações de insolvência dos bancos."}, {"ref": "3946", "section": "14.11", "q": "Os Títulos Públicos Federais:", "options": ["apresentam sempre remuneração prefixada.", "proporcionam lucro ao investidor quando o preço de resgate for superior ao preço de aquisição.", "têm rendimento real positivo quando sua remuneração nominal for inferior à taxa de inflação do período.", "podem ter seu rendimento indexado à inflação, apenas."], "correct": 1, "id": 101, "justificationText": "A alternativa B está correta porque, em investimentos, o lucro é obtido quando o preço de resgate é superior ao preço de aquisição. Isso se aplica aos Títulos Públicos Federais, onde a valorização do título em relação ao seu custo inicial resulta em ganho para o investidor."}, {"ref": "4137", "section": "14.11", "q": "No Brasil, a meta de inflação é determinada pelo:", "options": ["BACEN.", "Copom.", "MF.", "CMN."], "correct": 3, "id": 102, "justificationText": "INSUFICIENTE: O contexto não fornece informações sobre a determinação da meta de inflação no Brasil."}, {"ref": "4116", "section": "14.11", "q": "Uminvestidorquequeiraseprotegerdainflaçãoemumaaplicação de quatro anos deveria decidir por:", "options": ["investir na caderneta de poupança.", "investir em um Tesouro prefixado (LTN).", "investir em uma Tesouro prefixado com juros semestrais (NTN-F).", "investir em uma Tesouro IPCA+ (NTN-B Principal)."], "correct": 3, "id": 103, "justificationText": "A alternativa D está correta porque o Tesouro IPCA+ (NTN-B Principal) é um título que garante a rentabilidade atrelada à inflação, proporcionando proteção contra a perda do poder de compra ao longo do tempo. Isso é especialmente relevante para um investimento de quatro anos, pois o rendimento é ajustado pela variação do IPCA, assegurando que o investidor mantenha seu capital real."}, {"ref": "4050", "section": "14.11", "q": "Os certificados de depósitos bancários (CDBs) são:", "options": ["de emissão das instituições financeiras, que lastreiam as operações no mer- cado interbancário que sua negociação é restrita.", "de emissão dos bancos comerciais e de investimentos, que podem ser vis- tos como um depósito bancário, já que ao comprar o CDB o investidor está emprestando o dinheiro ao banco e recebendo em troca o pagamento de juros.", "que não admitem negociação antes de seu vencimento (não são transfer- íveis).", "pós-fixados e só sabemos a remuneração no vencimento."], "correct": 1, "id": 104, "justificationText": "A alternativa B está correta porque os certificados de depósitos bancários (CDBs) são de emissão dos bancos comerciais e de investimentos, e ao adquirir um CDB, o investidor efetivamente empresta dinheiro ao banco, recebendo juros em troca. Essa relação é similar a um depósito bancário, onde o investidor confia seus recursos à instituição financeira."}, {"ref": "3544", "section": "14.11", "q": "A empresa aplicou em um CDB com prazo de vencimento de 600 dias, o IR vai incidir:", "options": ["noúltimodiaútildosmesesdemaioenovembroounoresgate,aqueocorrer primeiro, e será recolhido na fonte.", "noúltimodiaútildosmesesdemaioenovembroounoresgate,aqueocorrer primeiro e será recolhido pelo contribuinte via DARF.", "somente na ocasião do resgate, quando haverá o recebimento da renda e será recolhido na fonte.", "somente na ocasião do resgate, quando haverá o recebimento da renda e será recolhido via DARF."], "correct": 2, "id": 105, "justificationText": "A alternativa C está correta porque, segundo o contexto, o Imposto de Renda sobre aplicações em CDB é recolhido na fonte apenas na ocasião do resgate, quando o investidor recebe a renda. Não há menção a recolhimento via DARF ou em datas específicas antes do resgate."}, {"ref": "3424", "section": "14.11", "q": "Sobre a cobrança de IR em Títulos Públicos Federais:", "options": ["é cobrada a uma alíquota fixa de 15%.", "o pagamento do imposto é de responsabilidade do investidor e feito por meio de DARF.", "o fator gerador é o resgate no vencimento do título.", "aalíquotacobradareduzconformeotempodeaplicação,tendocomomenor valor 15%."], "correct": 3, "id": 106, "justificationText": "A alternativa D está correta porque a tributação para a pessoa física em títulos de renda fixa, como os Títulos Públicos Federais, segue a regra geral de que a alíquota do Imposto de Renda é reduzida conforme o tempo de aplicação, podendo chegar ao menor valor de 15%. Essa informação é consistente com as normas de tributação aplicáveis a esses investimentos."}, {"ref": "4210", "section": "14.11", "q": "No mercado brasileiro, os Títulos Públicos Federais são considera- dos ativos livres de risco. Qual afirmativa abaixo é verdadeira?", "options": ["OsTítulosPúblicosFederaissãorealmenteativoslivresporquenãopossuem risco de crédito, já que o Governo pode emitir moedas para honrá-los.", "OsTítulosPúblicosFederaissãoumaboaaproximaçãodoativolivrederisco, poisapesardeteremvolatilidadenãopossuemriscodecrédito,jáqueoGov- erno pode emitir moedas para honrá-los.", "OsTítulosPúblicosFederaissãoapenasumaaproximaçãogrosseiradoativo livrederiscodecrédito,poispossuemvolatilidadeetambémriscodecrédito.", "SomenteosTítulosPúblicosFederaisemitidosnoexteriordeveriamsercon- siderados ativo livre de risco, uma vez que as taxas de juros no mercado in- ternacional têm pouca volatilidade e pouco alteram o preço desses títulos."], "correct": 2, "id": 107, "justificationText": "A alternativa correta é a C, pois os Títulos Públicos Federais, apesar de serem considerados ativos com baixo risco de crédito, apresentam volatilidade e, portanto, não são completamente isentos de risco. A afirmação destaca que eles são apenas uma aproximação do ativo livre de risco, reconhecendo a possibilidade de flutuações em seu valor e a presença de risco de crédito."}, {"ref": "9884", "section": "14.11", "q": "Quanto à forma, as debêntures são classificadas em:", "options": ["escriturais ou permutáveis.", "nominativas ou simples.", "nominativas ou escriturais.", "conversíveis em ações ou permutáveis."], "correct": 2, "id": 108, "justificationText": "A alternativa C está correta porque as debêntures são classificadas como nominativas, que são aquelas registradas em nome do titular, e escriturais, que são aquelas que não possuem um certificado físico, sendo registradas em sistema eletrônico. Essa classificação é fundamental para entender a natureza e a forma de negociação desses títulos no mercado."}, {"ref": "3608", "section": "15.24", "q": "Quando o preço de exercício de uma opção de compra é infe- rior ao preço à vista corr a."], "correct": 2, "id": 112, "justificationText": "A alternativa C está correta porque a diferença entre o valor do índice Bovespa e o contrato futuro reflete a expectativa de alta do Ibovespa. Quando os investidores acreditam que o índice irá subir, isso se reflete nos preços dos contratos futuros, que tendem a ser negociados a valores superiores ao índice à vista."}, {"ref": "3642", "section": "15.24", "q": "No mercado a termo de ações da B3, as garantias:", "options": ["são exigidas apenas dos vendedores.", "são exigidas dos compradores e dos vendedores.", "são exigidas das empresas emissoras das ações.", "são exigidas apenas dos compradores."], "correct": 1, "id": 113, "justificationText": "A alternativa B está correta porque, no mercado a termo de ações da B3, as garantias são exigidas tanto dos compradores quanto dos vendedores para assegurar o cumprimento das obrigações contratuais. Isso garante a integridade das operações realizadas nesse mercado."}, {"ref": "4255", "section": "15.24", "q": "Uma empresa possui dívidas em dólar. Seu diretor financeiro avaliaqueorealtemgrandeschancesdesedesvalorizarfortementeno curto prazo. A operação que permite alavancar mais este movimento e ganhar dinheiro em reais é:", "options": ["comprar calls de dólar dentro do dinheiro.", "vender calls de dólar dentro do dinheiro.", "vender calls de dólar fora do dinheiro.", "comprar calls de dólar fora do dinheiro."], "correct": 3, "id": 114, "justificationText": "A alternativa correta é comprar calls de dólar fora do dinheiro, pois essa estratégia permite que a empresa se beneficie da valorização do dólar em relação ao real, alavancando ganhos em um cenário de desvalorização da moeda local. A compra de calls fora do dinheiro é uma forma de se proteger contra a alta do dólar, permitindo que a empresa capitalize sobre a expectativa de desvalorização do real."}, {"ref": "4554", "section": "15.24", "q": "Todos os fatores que afetam o prêmio de uma call são:", "options": ["juros, prazo         const STORAGE = {
            1: "ancord_sim1_v2",
            2: "ancord_top_v1"
        };

        const META = {
            1: {
                title: "Simulado ANCORD 1",
                desc: "80 quest\u00f5es \u00b7 Gabarito apostila Fevereiro/2024 (Rafael Toro). Timer padr\u00e3o: 2 h 30 min (prova oficial ANCORD \u00b7 FGV)."
            },
            2: {
                title: "Simulado Top Invest",
                desc: "117 quest\u00f5es \u00b7 Material Top Invest (justificativa ao errar). Timer com ritmo equivalente ao da prova oficial (~219 min)."
            }
        };

        const EXAM_DURATION_SEC = {
            1: 9000,
            2: 13162
        };

        const TIMER_STORAGE = "ancord_exam_timer_v3";

        let activeTab = 1;

        const hitsEl = document.getElementById("hits");
        const wrongEl = document.getElementById("wrong");
        const answeredEl = document.getElementById("answered");
        const pctEl = document.getElementById("pct");
        const pctTotalEl = document.getElementById("pct-total");
        const partialLabel = document.getElementById("partial-label");
        const progressBar = document.getElementById("progress-bar");
        const container = document.getElementById("quiz-container");
        const timerDisplay = document.getElementById("timer-display");
        const timerCaption = document.getElementById("timer-caption");
        const timerStartBtn = document.getElementById("timer-start");
        const timerResetBtn = document.getElementById("timer-reset");
        const scorePanelEl = document.querySelector(".score-panel");

        function getQuestions() {
            return activeTab === 1 ? QUESTIONS_S1 : QUESTIONS_S2;
        }

        function storageKey() {
            return STORAGE[activeTab];
        }

        function loadSaved() {
            try {
                return JSON.parse(localStorage.getItem(storageKey()) || "{}");
            } catch (e) {
                return {};
            }
        }

        function loadTimerState() {
            try {
                return JSON.parse(localStorage.getItem(TIMER_STORAGE) || "{}");
            } catch (e) {
                return {};
            }
        }

        function saveTimerState(state) {
            localStorage.setItem(TIMER_STORAGE, JSON.stringify(state));
        }

        function getTimerSlot() {
            const st = loadTimerState();
            const tab = String(activeTab);
            if (!st[tab]) st[tab] = { startAt: null, durationSec: EXAM_DURATION_SEC[activeTab] };
            return st;
        }

        function formatRemain(sec) {
            sec = Math.max(0, Math.floor(sec));
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            if (h > 0)
                return (
                    h +
                    ":" +
                    String(m).padStart(2, "0") +
                    ":" +
                    String(s).padStart(2, "0")
                );
            return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        }

        function updateTimerUI() {
            const st = getTimerSlot();
            const tab = String(activeTab);
            const slot = st[tab] || {};
            const dur = slot.durationSec ?? EXAM_DURATION_SEC[activeTab];
            if (activeTab === 1) {
                timerCaption.textContent = "Prova ANCORD oficial · 2 h 30 min (" + getQuestions().length + " questões)";
            } else {
                timerCaption.textContent =
                    "Ritmo equivalente à prova · " +
                    Math.round(dur / 60) +
                    " min (" +
                    getQuestions().length +
                    " questões)";
            }
            if (!slot.startAt) {
                timerDisplay.textContent = formatRemain(dur);
                timerStartBtn.textContent = "Iniciar";
                scorePanelEl.classList.remove("timer-expired");
                return;
            }
            const elapsed = (Date.now() - slot.startAt) / 1000;
            const left = dur - elapsed;
            timerDisplay.textContent = formatRemain(left);
            timerStartBtn.textContent = "Em andamento";
            if (left <= 0) scorePanelEl.classList.add("timer-expired");
            else scorePanelEl.classList.remove("timer-expired");
        }

        let timerInterval = null;
        function ensureTimerTick() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimerUI, 1000);
        }

        function saveAnswer(qId, optionIdx) {
            const data = loadSaved();
            data[qId] = optionIdx;
            localStorage.setItem(storageKey(), JSON.stringify(data));
            updateScore();
            renderHints();
        }

        function updateScore() {
            const questions = getQuestions();
            const data = loadSaved();
            let hits = 0, wrong = 0, answered = 0;
            questions.forEach((item) => {
                const sel = data[item.id];
                if (sel === undefined || sel === null) return;
                answered++;
                if (sel === item.correct) hits++;
                else wrong++;
            });
            hitsEl.textContent = hits;
            wrongEl.textContent = wrong;
            answeredEl.textContent = answered;
            const rate = answered ? Math.round((hits / answered) * 1000) / 10 : 0;
            pctEl.textContent = rate + "%";
            const rateTotal = Math.round((hits / questions.length) * 1000) / 10;
            pctTotalEl.textContent = rateTotal + "%";
            partialLabel.textContent = "Parcial sobre " + questions.length + " questões";
            progressBar.style.width = (answered / questions.length * 100) + "%";
        }

        function renderHints() {
            const questions = getQuestions();
            const data = loadSaved();
            questions.forEach((item) => {
                const sel = data[item.id];
                const nOpt = item.options.length;
                for (let o = 0; o < nOpt; o++) {
                    const lab = document.getElementById(
                        "label-" + activeTab + "-" + item.id + "-" + o
                    );
                    if (!lab) continue;
                    lab.classList.remove("correct", "wrong", "reveal-correct");
                }
                const wrongBox = document.getElementById("wrong-" + activeTab + "-" + item.id);
                if (wrongBox) {
                    if (sel === undefined || sel === null || sel === item.correct) {
                        wrongBox.hidden = true;
                    } else {
                        wrongBox.hidden = false;
                    }
                }
                if (sel === undefined || sel === null) return;
                for (let o = 0; o < nOpt; o++) {
                    const lab = document.getElementById(
                        "label-" + activeTab + "-" + item.id + "-" + o
                    );
                    if (!lab) continue;
                    if (o === sel) {
                        lab.classList.add(o === item.correct ? "correct" : "wrong");
                    }
                    if (sel !== item.correct && o === item.correct) {
                        lab.classList.add("reveal-correct");
                    }
                }
            });
        }

        function initQuiz() {
            const questions = getQuestions();
            container.innerHTML = "";
            const data = loadSaved();
            questions.forEach((item, qIdx) => {
                const card = document.createElement("div");
                card.className = "question-card";
                if (activeTab === 2 && item.ref) {
                    const rt = document.createElement("div");
                    rt.className = "ref-tag";
                    rt.textContent = "Ref. #" + item.ref + (item.section ? " · Módulo " + item.section : "");
                    card.appendChild(rt);
                }
                const title = document.createElement("div");
                title.className = "question-text";
                title.textContent = (qIdx + 1) + ". " + item.q;
                card.appendChild(title);
                const opts = document.createElement("div");
                item.options.forEach((opt, oIdx) => {
                    const lab = document.createElement("label");
                    lab.className = "option-label";
                    lab.id = "label-" + activeTab + "-" + item.id + "-" + oIdx;
                    const inp = document.createElement("input");
                    inp.type = "radio";
                    inp.name = "quiz" + activeTab + "-q-" + item.id;
                    inp.value = String(oIdx);
                    if (data[item.id] === oIdx) inp.checked = true;
                    inp.addEventListener("change", () => saveAnswer(item.id, oIdx));
                    const span = document.createElement("span");
                    span.className = "opt-text";
                    span.textContent = String.fromCharCode(65 + oIdx) + ") " + opt;
                    lab.appendChild(inp);
                    lab.appendChild(span);
                    opts.appendChild(lab);
                });
                card.appendChild(opts);

                const footer = document.createElement("div");
                footer.className = "q-footer";
                const cLet = String.fromCharCode(65 + item.correct);
                const cText = item.options[item.correct];
                const wrongReveal = document.createElement("div");
                wrongReveal.className = "wrong-reveal";
                wrongReveal.id = "wrong-" + activeTab + "-" + item.id;
                const wrStrong = document.createElement("strong");
                wrStrong.textContent = "Resposta correta:";
                wrongReveal.appendChild(wrStrong);
                wrongReveal.appendChild(document.createTextNode(" "));
                wrongReveal.appendChild(
                    document.createTextNode(cLet + ") " + cText)
                );
                if (activeTab === 2 && item.justificationText) {
                    const jt = document.createElement("div");
                    jt.className = "justification-text";
                    jt.textContent = item.justificationText;
                    wrongReveal.appendChild(jt);
                }
                wrongReveal.hidden = true;
                footer.appendChild(wrongReveal);

                card.appendChild(footer);
                container.appendChild(card);
            });
            document.getElementById("hdr-title").textContent = META[activeTab].title;
            document.getElementById("hdr-desc").textContent = META[activeTab].desc;
            updateScore();
            renderHints();
            updateTimerUI();
        }

        document.querySelectorAll(".tab-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                const t = parseInt(btn.getAttribute("data-tab"), 10);
                if (t === activeTab) return;
                activeTab = t;
                document.querySelectorAll(".tab-btn").forEach((b) =>
                    b.classList.toggle("active", parseInt(b.getAttribute("data-tab"), 10) === activeTab)
                );
                initQuiz();
            });
        });

        timerStartBtn.addEventListener("click", () => {
            const st = getTimerSlot();
            const tab = String(activeTab);
            const slot = st[tab] || {};
            if (slot.startAt) return;
            slot.durationSec = EXAM_DURATION_SEC[activeTab];
            slot.startAt = Date.now();
            st[tab] = slot;
            saveTimerState(st);
            updateTimerUI();
        });

        timerResetBtn.addEventListener("click", () => {
            if (!confirm("Zerar o timer desta aba? O cronômetro volta ao tempo integral e para de contar até você iniciar de novo.")) return;
            const st = loadTimerState();
            const tab = String(activeTab);
            st[tab] = { startAt: null, durationSec: EXAM_DURATION_SEC[activeTab] };
            saveTimerState(st);
            updateTimerUI();
        });

        document.getElementById("btn-clear").addEventListener("click", () => {
            if (confirm("Limpar todas as respostas desta aba neste dispositivo?")) {
                localStorage.removeItem(storageKey());
                initQuiz();
            }
        });

        ensureTimerTick();
        initQuiz();
    </script>
</body>
</html>
